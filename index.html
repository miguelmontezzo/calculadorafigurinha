<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Calculadora 3D — Entrar</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230071e3'/%3E%3Cpath d='M16 7l8 4.5v9L16 25l-8-4.5v-9z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="auth-page">
  <div class="card auth-card">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.5l8.5 4.75v9.5L12 21.5l-8.5-4.75v-9.5z"/><path d="M3.5 7.25L12 12l8.5-4.75M12 12v9.5"/></svg>
    </div>
    <h1>Calculadora 3D</h1>
    <p class="lead">Precifique suas impressões em segundos.</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email" class="sr-only" hidden>Email</label>
        <input type="email" id="email" placeholder="Seu email de compra" autocomplete="email" inputmode="email" required autofocus>
      </div>
      <div id="errorMsg" class="form-error" role="alert"></div>
      <button type="submit" id="loginBtn" class="btn btn-primary btn-lg btn-block">Continuar</button>
    </form>
  </div>

  <p class="auth-foot">
    Ainda não tem acesso? <a href="https://figurinhaai.com.br/" target="_blank" rel="noopener">Adquira aqui</a>
  </p>
</main>

<!-- Email não cadastrado -->
<div id="modalNaoEncontrado" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="nfTitle">
  <div class="modal modal-center">
    <div class="modal-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16.2v.3"/></svg>
    </div>
    <h2 id="nfTitle">Email não encontrado</h2>
    <p><strong id="modalEmail"></strong> ainda não tem acesso à Calculadora 3D. Use o mesmo email da compra ou adquira o acesso.</p>
    <div class="actions">
      <a class="btn btn-primary btn-block" href="https://figurinhaai.com.br/" target="_blank" rel="noopener">Quero adquirir acesso</a>
      <button class="btn btn-secondary btn-block" id="modalFechar">Tentar outro email</button>
    </div>
  </div>
</div>

<!-- Entrando -->
<div id="loadingScreen" class="boot" aria-live="polite">
  <div class="printer">
    <div class="frame"></div>
    <div class="head"></div>
    <div class="layers"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="base"></div>
  </div>
  <div style="text-align:center">
    <div class="title">Preparando sua calculadora</div>
    <div class="small muted">Só um instante…</div>
  </div>
  <div class="boot-bar"><i></i></div>
</div>

<script src="auth.js"></script>
</body>
</html>
